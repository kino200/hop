[package]
name = "hop-desktop"
version = "0.5.3"
edition = "2021"
description = "HOP - Open HWP desktop app"
license = "MIT"

[lib]
name = "hop_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "hop-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hop-rhwp-adapter = { path = "../rhwp-adapter" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2.5"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
zeroize = "1"
log = "0.4"
open = "5"
usvg = "0.45"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSDocumentController", "NSWorkspace", "NSImage", "NSBezierPath", "NSColor", "NSApplication", "NSWindow", "NSView", "NSAccessibility", "NSAccessibilityProtocols"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSURL", "NSString", "NSGeometry", "NSArray"] }

objc2 = "0.6.3"
block2 = "0.6.2"

[profile.release]
lto = "thin"
strip = "symbols"
